name: CI (Test and Typecheck)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-rydexx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: rydexx/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rydexx

      - name: Run TypeScript checks
        run: npx tsc --noEmit
        working-directory: rydexx

      - name: Run Vitest API tests
        run: npm run test
        working-directory: rydexx

  test-socketserver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: socketServer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: socketServer

      - name: Run Vitest WebSocket tests
        run: npm run test
        working-directory: socketServer
